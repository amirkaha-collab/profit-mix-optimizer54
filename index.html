<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F8 · תכנון הון</title><style>body{font-family:Arial,sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f7f9fb;color:#17324f}.box{text-align:center}.spin{width:34px;height:34px;border:4px solid #dce6ee;border-top-color:#2f7f78;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><strong>פותח את F8…</strong></div><script>
(async()=>{try{const parts=[];for(let i=0;i<14;i++){const r=await fetch(`payload/part-${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('payload '+i);parts.push(await r.text())}const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();txt=txt.replace('<head>','<head><base href="./ui/">');document.open();document.write(txt);document.close();}catch(e){document.body.innerHTML='<div class="box"><strong>לא ניתן לפתוח את המערכת</strong><div style="margin-top:8px">'+String(e)+'</div></div>';console.error(e)}})();
</script></body></html>
